<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>静电场模拟 · Electric Field Lab</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 主画布 -->
<canvas id="field"></canvas>

<!-- 顶栏 -->
<header class="topbar">
  <div class="brand">
    <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/>
      <path d="M12 4.2c0 3-1.4 4.2-2.9 5.4a5 5 0 0 0 5.8 0C13.4 8.4 12 7.2 12 4.2Z"/>
      <path d="M12 19.8c0-3 1.4-4.2 2.9-5.4a5 5 0 0 0-5.8 0c1.5 1.2 2.9 2.4 2.9 5.4Z"/>
      <path d="M4.5 6.5c2.6 1.4 3.4 3.1 3.6 5.9a5.4 5.4 0 0 0-7.2 0c.2-2.8 1-4.5 3.6-5.9ZM19.5 6.5c2.6 1.4 3.4 3.1 3.6 5.9a5.4 5.4 0 0 1-7.2 0c.2-2.8 1-4.5 3.6-5.9Z"/>
    </svg>
    <span>静电场模拟</span>
    <em>Electrostatic Field Lab</em>
  </div>
  <div class="hint">
    <span><kbd>拖动</kbd> 电荷移动</span>
    <span><kbd>滚轮</kbd> 缩放 · <kbd>拖拽</kbd> 空白平移</span>
    <span><kbd>双击</kbd> 空白添加电荷</span>
    <span><kbd>Del</kbd> 删除选中电荷</span>
  </div>
</header>

<!-- 右侧控制面板 -->
<aside class="panel" id="panel">
  <div class="panel-head">
    <span class="panel-title">控制面板</span>
    <button class="icon-btn collapse-btn" id="collapseBtn" title="折叠面板" aria-label="折叠面板">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
  </div>

  <div class="panel-body">
    <!-- 电荷 -->
    <section class="sec" id="secCharges">
      <div class="sec-head">
        <h3>点电荷</h3>
        <div class="sec-actions">
          <button class="mini-btn" id="addPos" title="添加正电荷"><span class="sign">+</span>正</button>
          <button class="mini-btn" id="addNeg" title="添加负电荷"><span class="sign">−</span>负</button>
        </div>
      </div>
      <div class="charge-list" id="chargeList"></div>
      <div class="empty-charges" id="emptyCharges">暂无电荷，双击画布或点击上方按钮添加</div>
      <label class="row toggle-row" style="margin-top:10px" title="开启后，拖动电荷时仅沿 x 方向移动">
        <span>X 轴锁定（仅沿 x 拖动）</span>
        <span class="toggle">
          <input type="checkbox" id="tglLockX"><i></i>
        </span>
      </label>
    </section>

    <!-- 显示开关 -->
    <section class="sec">
      <div class="sec-head"><h3>显示</h3></div>
      <label class="row toggle-row">
        <span>电场线</span>
        <span class="toggle">
          <input type="checkbox" id="tglField" checked><i></i>
        </span>
      </label>
      <label class="row toggle-row">
        <span>等势面（等势线）</span>
        <span class="toggle">
          <input type="checkbox" id="tglEqui" checked><i></i>
        </span>
      </label>
      <label class="row toggle-row">
        <span>坐标刻度</span>
        <span class="toggle">
          <input type="checkbox" id="tglGrid" checked><i></i>
        </span>
      </label>
    </section>

    <!-- 电场线设置 -->
    <section class="sec" id="secField">
      <div class="sec-head"><h3>电场线</h3></div>
      <div class="row">
        <span>密度</span>
        <input type="range" id="fldDensity" min="4" max="48" step="2" value="24">
        <output id="fldDensityOut" class="val">24</output>
      </div>
      <div class="row">
        <span>线宽</span>
        <input type="range" id="fldWidth" min="1" max="3.5" step="0.1" value="1.7">
        <output id="fldWidthOut" class="val">1.7</output>
      </div>
      <div class="row">
        <span>样式</span>
        <div class="btn-group" id="fldStyle">
          <button data-style="solid" class="active">实线</button>
          <button data-style="dashed">虚线</button>
        </div>
      </div>
      <label class="row toggle-row">
        <span>方向箭头</span>
        <span class="toggle"><input type="checkbox" id="tglArrows" checked><i></i></span>
      </label>
      <div class="row color-row">
        <span>颜色</span>
        <div class="swatches" id="fldSwatches">
          <button class="swatch" data-c="#43536e" style="--c:#43536e"></button>
          <button class="swatch" data-c="#7d5a8c" style="--c:#7d5a8c"></button>
          <button class="swatch" data-c="#3f6f7a" style="--c:#3f6f7a"></button>
          <button class="swatch" data-c="#8c6a4a" style="--c:#8c6a4a"></button>
          <label class="swatch custom" title="自定义">
            <input type="color" id="fldColor" value="#43536e">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 3v10M3 8h10"/></svg>
          </label>
        </div>
      </div>
    </section>

    <!-- 等势面设置 -->
    <section class="sec" id="secEqui">
      <div class="sec-head"><h3>等势面</h3></div>
      <div class="row">
        <span>等势线条数</span>
        <input type="range" id="eqLevels" min="4" max="26" step="2" value="14">
        <output id="eqLevelsOut" class="val">14</output>
      </div>
      <div class="row">
        <span>透明度</span>
        <input type="range" id="eqOpacity" min="0.08" max="0.9" step="0.02" value="0.5">
        <output id="eqOpacityOut" class="val">0.50</output>
      </div>
      <div class="row color-row">
        <span>颜色</span>
        <div class="swatches" id="eqSwatches">
          <button class="swatch" data-c="#6f8fc4" style="--c:#6f8fc4"></button>
          <button class="swatch" data-c="#8fae6d" style="--c:#8fae6d"></button>
          <button class="swatch" data-c="#c49a6f" style="--c:#c49a6f"></button>
          <button class="swatch" data-c="#a87890" style="--c:#a87890"></button>
          <label class="swatch custom" title="自定义">
            <input type="color" id="eqColor" value="#6f8fc4">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 3v10M3 8h10"/></svg>
          </label>
        </div>
      </div>
    </section>

    <!-- 图像设置 -->
    <section class="sec" id="secPlot">
      <div class="sec-head"><h3>图像（φ-x / E-x / Ep-x）</h3></div>
      <div class="row">
        <span>测试电荷 q₀</span>
        <input type="number" class="num" id="plotQ0" value="1" step="0.5" min="-99" max="99">
        <span class="unit">μC</span>
      </div>
      <div class="row">
        <span>采样线 y =</span>
        <input type="number" class="num" id="plotY" value="0" step="0.5">
        <span class="unit">m</span>
      </div>
      <div class="row">
        <span>x 范围</span>
        <div class="range-inputs">
          <input type="number" class="num" id="plotXMin" placeholder="跟随视口" step="1">
          <i>—</i>
          <input type="number" class="num" id="plotXMax" placeholder="跟随视口" step="1">
        </div>
      </div>
    </section>
  </div>

  <div class="panel-foot">
    <button class="btn ghost" id="btnResetView">重置视图</button>
    <button class="btn ghost danger" id="btnClearAll">清空电荷</button>
  </div>
</aside>

<!-- 图像小窗口 -->
<div class="plot-window" id="plotWindow">
  <div class="plot-head" id="plotHead">
    <span class="plot-title">一维分布图</span>
    <nav class="tabs" id="plotTabs">
      <button data-tab="phi" class="active">φ–x</button>
      <button data-tab="ex">E–x</button>
      <button data-tab="ep">Ep–x</button>
    </nav>
    <button class="icon-btn win-btn" id="plotMin" title="最小化" aria-label="最小化">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 12h12"/></svg>
    </button>
    <button class="icon-btn win-btn" id="plotClose" title="关闭" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>
    </button>
  </div>
  <div class="plot-body" id="plotBody">
    <canvas id="plotCanvas"></canvas>
    <div class="plot-placeholder" id="plotPlaceholder">添加电荷以查看分布图像</div>
  </div>
  <div class="plot-resize" id="plotResize" title="拖拽调整大小"></div>
</div>

<!-- 右下角功能按钮（恢复图像窗口用） -->
<button class="fab hidden" id="plotRestore" title="打开分布图像">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 18v-6a8 8 0 0 1 16 0v6"/><path d="M4 18h4v4H4zM16 18h4v4h-4z"/>
  </svg>
</button>

<!-- 面板折叠后的展开按钮 -->
<button class="fab panel-fab hidden" id="panelRestore" title="展开控制面板">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 7h14M5 12h14M5 17h14"/><path d="M9 7v10M15 7v10" opacity=".45"/>
  </svg>
</button>

<script src="script.js"></script>
</body>
</html>
